<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- head: each page's title and tags (src/head.ts), written by the build -->
    <title>VoteStack</title>
    <!-- /head -->
    <!-- Apply a saved light or dark choice before first paint, so the page
         doesn't flash the device's mode first (src/theme/themePreference.ts). -->
    <script>
      try {
        var theme = localStorage.getItem('votestack:theme:v1')
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
