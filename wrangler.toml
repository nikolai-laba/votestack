name = "votestack"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# The site is served only on its custom domain (votestack.org), so search
# engines and visitors see one address; the workers.dev URL stays off.
workers_dev = false
preview_urls = false

# The built React app (dist/) is served as static assets. Every page is
# prerendered to its own file (scripts/prerender.ts): /about is about.html,
# /candidates/{key} is candidates/{key}.html. An address with no file gets
# 404.html (the app, which shows "Page not found") with a 404 status, so
# search engines don't index it. Only /api/* runs the Worker, plus addresses
# ending in / or .html, which it redirects permanently (301) to the page's
# own address (worker/redirects.ts) instead of Cloudflare's temporary 307.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/*/", "/*.html"]

# Rate limit for error reports (POST /api/report): 5 per minute per
# reader. The key is a hash of the IP address, which is never stored.
# namespace_id is any number unique within the Cloudflare account.
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Rate limit for "tell me when VoteStack reaches my area" sign-ups (POST
# /api/notify): 5 per minute per visitor, counted apart from error reports.
[[ratelimits]]
name = "NOTIFY_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 5
  period = 60

# Rate limit for ballot lookups (POST /api/ballot): 30 per minute per
# visitor, far above what a person types, so a script can't slow the
# database for everyone. Keyed by a hash of the IP address; the address
# typed in is never part of it.
[[ratelimits]]
name = "BALLOT_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 30
  period = 60
